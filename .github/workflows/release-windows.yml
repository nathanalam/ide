name: Release - Windows

on:
  workflow_call:
    inputs:
      release_version:
        description: Version of the release to build and upload to
        type: string
        required: false
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version of the release (default: <vscode tag> + hours elapsed this year)"
        type: string
        required: false

env:
  APP_NAME: Rush
  ASSETS_REPOSITORY: ${{ github.repository }}
  BINARY_NAME: rush
  # no version feed is published for this fork, so don't let the app self-update
  DISABLE_UPDATE: 'yes'
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: Rush Automations
  OS_NAME: windows
  SHOULD_BUILD: 'yes'
  SHOULD_BUILD_CLI: 'no'
  # the MSI packages need the WiX toolset and are not part of the release
  SHOULD_BUILD_MSI: 'no'
  SHOULD_BUILD_MSI_NOUP: 'no'
  SHOULD_BUILD_REH: 'no'
  SHOULD_BUILD_REH_WEB: 'no'
  VSCODE_QUALITY: stable

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./release_version.sh

  compile:
    needs:
      - version
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      MS_COMMIT: ${{ needs.version.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.version.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
      VSCODE_ARCH: x64
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Clone VSCode repo
        run: ./get_repo.sh

      # the build downloads prebuilt extensions from the GitHub API, which is
      # rate limited to 60 requests per hour for unauthenticated callers
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build.sh

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt

      - name: Upload vscode artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-windows
          path: ./vscode.tar.gz
          retention-days: 1

  build:
    needs:
      - version
      - compile
    runs-on: windows-2022
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        vscode_arch:
          - x64
          - arm64
    defaults:
      run:
        shell: bash
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ needs.version.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.version.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-windows

      - name: Package binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.vscode_arch }}
          npm_config_target_arch: ${{ matrix.vscode_arch }}
        run: ./build/windows/package.sh

      # unsigned: the installers and the ZIP are not code-signed
      - name: Prepare assets
        run: ./prepare_assets.sh

      - name: Prepare checksums
        run: ./prepare_checksums.sh

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./release.sh
